[package]
name = "rise-pulsebar"
version = "1.0.2"
description = "Rise PulseBar — macOS menu bar system monitor"
authors = ["Rise"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "rise_pulsebar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
log = "0.4"
objc = "0.2"
